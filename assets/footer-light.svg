<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Signal out">
<title>Signal out</title>
<style>
  .d{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.6s cubic-bezier(0.16,1,0.3,1) backwards}
  @keyframes draw{from{stroke-dashoffset:1}}
  .fade{animation:fade .9s cubic-bezier(0.16,1,0.3,1) backwards}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
.spark{animation:spark 3.2s ease-in-out 1.6s infinite}
  @keyframes spark{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6) rotate(45deg)}}</style>

  <rect x=".5" y=".5" width="1199" height="209" rx="14" fill="#F3F1EC" stroke="#D8D3C8"/>
  <g transform="translate(548 22) scale(1.625)">
    <path class="d" pathLength="1" d="M32 4 56.25 18v28L32 60 7.75 46V18z" fill="none" stroke="#0A7268" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.2s"/>
    <path class="d" pathLength="1" d="M32 10 51.05 21v22L32 54 12.95 43V21z" fill="none" stroke="#D8D3C8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.45s"/>
    <path class="d" pathLength="1" d="M16 51 32 13 48 51" fill="none" stroke="#10161D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.75s"/>
    <path class="d" pathLength="1" d="M21.5 38 32 46 42.5 38" fill="none" stroke="#7E5A1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.15s"/>
    <path class="spark" d="M52 49.5 53.2 52.8 56.5 54 53.2 55.2 52 58.5 50.8 55.2 47.5 54 50.8 52.8z" fill="#C21F48" style="transform-origin:center;transform-box:fill-box"/>
  </g>
  <text x="600" y="160" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#10161D">Signal out.</text>
  <text x="600" y="190" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#3E4952">the sigil remembers — every project here is real, tested, and still being sharpened</text>
</svg>
